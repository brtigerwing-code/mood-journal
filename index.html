<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#4CAF50">

    <link rel="manifest" href="manifest.json">

    <title>My Journal</title>

    <style>

        * {

            box-sizing: border-box;

        }

        body {

            font-family: sans-serif;

            padding: 20px;

            max-width: 600px;

            margin: auto;

            background: #f8faf8;

            color: #333;

        }

        h2 {

            margin-bottom: 12px;

        }

        h3 {

            margin-top: 28px;

        }

        .date-navigation {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 12px;

            margin-bottom: 20px;

        }

        .date-navigation button {

            width: 60px;

            margin: 0;

        }

        #currentDateLabel {

            font-weight: bold;

            text-align: center;

        }

        .mood-selector {

            display: flex;

            justify-content: space-between;

            gap: 4px;

            margin: 16px 0;

        }

        .mood-selector label {

            flex: 1;

            text-align: center;

            padding: 10px 2px;

            border: 1px solid #ccc;

            border-radius: 8px;

            background: white;

            cursor: pointer;

        }

        .mood-selector input {

            margin-right: 3px;

        }

        textarea {

            width: 100%;

            height: 100px;

            padding: 10px;

            font-size: 16px;

            margin-top: 10px;

        }

        button {

            padding: 10px;

            margin-top: 10px;

            cursor: pointer;

            border: 1px solid #bbb;

            border-radius: 6px;

            background: white;

            font-size: 15px;

        }

        button:hover {

            background: #eee;

        }

        .save-button {

            width: 100%;

            background: #4CAF50;

            color: white;

            border: none;

            font-weight: bold;

        }

        .entry {

            border-bottom: 1px solid #ccc;

            margin-top: 10px;

            padding: 12px 0;

        }

        .delete-button {

            color: #b00020;

            border-color: #d99;

        }

        .empty-message {

            color: #777;

            padding: 20px 0;

        }

        .chart-container {

            position: relative;

            width: 100%;

            height: 280px;

        }

        canvas {

            max-width: 100%;

        }

        .status-message {

            color: #4CAF50;

            font-size: 14px;

            min-height: 20px;

        }

    </style>

</head>

<body>

<h2>今の気分は？</h2>

<div class="date-navigation">

    <button id="prevDateButton" type="button">←</button>

    <span id="currentDateLabel"></span>

    <button id="nextDateButton" type="button">→</button>

</div>

<div class="mood-selector">

    <label><input type="radio" name="mood" value="1">1</label>

    <label><input type="radio" name="mood" value="2">2</label>

    <label><input type="radio" name="mood" value="3">3</label>

    <label><input type="radio" name="mood" value="4" checked>4</label>

    <label><input type="radio" name="mood" value="5">5</label>

    <label><input type="radio" name="mood" value="6">6</label>

    <label><input type="radio" name="mood" value="7">7</label>

</div>

<p>気分スコア: <span id="moodValue">4</span></p>

<p id="prompt"></p>

<textarea id="textInput" placeholder="感じたことを自由に書いてください（任意）"></textarea>

<button class="save-button" id="saveButton" type="button">保存</button>

<p id="statusMessage" class="status-message"></p>

<h3>気分の推移（30日間）</h3>

<div class="chart-container">

    <canvas id="moodChart"></canvas>

</div>

<h3>記録一覧</h3>

<div id="entries"></div>

<script>

"use strict";

const prompts = [

    "今日いちばん印象に残ったことは？",

    "今の気分の原因は？",

    "体調はどう？",

    "誰とのやり取りが心に残った？",

    "今日食べたものは？"

];

let currentDate = new Date();

currentDate.setHours(0, 0, 0, 0);

let chartInstance = null;

const slider = null;

const moodValue = document.getElementById("moodValue");

const promptText = document.getElementById("prompt");

const textInput = document.getElementById("textInput");

const entriesContainer = document.getElementById("entries");

const currentDateLabel = document.getElementById("currentDateLabel");

const statusMessage = document.getElementById("statusMessage");

promptText.textContent =

    prompts[Math.floor(Math.random() * prompts.length)];

function formatDate(date) {

    return date.toLocaleDateString("ja-JP", {

        year: "numeric",

        month: "long",

        day: "numeric",

        weekday: "short"

    });

}

function getDateKey(date) {

    const year = date.getFullYear();

    const month = String(date.getMonth() + 1).padStart(2, "0");

    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;

}

function updateDateLabel() {

    currentDateLabel.textContent = formatDate(currentDate);

}

function changeDate(offset) {

    currentDate.setDate(currentDate.getDate() + offset);

    updateDateLabel();

    loadEntries();

    drawChart();

}

function getEntries() {

    try {

        const saved = localStorage.getItem("journalEntries");

        if (!saved) {

            return [];

        }

        const parsed = JSON.parse(saved);

        return Array.isArray(parsed) ? parsed : [];

    } catch (error) {

        console.error("記録の読み込みに失敗しました:", error);

        return [];

    }

}

function saveEntry() {

    const selectedMood = document.querySelector(

        'input[name="mood"]:checked'

    );

    if (!selectedMood) {

        alert("気分スコアを選択してください。");

        return;

    }

    const mood = Number(selectedMood.value);

    const text = textInput.value.trim();

    const entry = {

        id: Date.now().toString(),

        date: getDateKey(currentDate),

        timestamp: new Date().toISOString(),

        mood: mood,

        text: text

    };

    const entries = getEntries();

    entries.push(entry);

    try {

        localStorage.setItem(

            "journalEntries",

            JSON.stringify(entries)

        );

    } catch (error) {

        alert("記録の保存に失敗しました。");

        console.error(error);

        return;

    }

    textInput.value = "";

    statusMessage.textContent = "保存しました。";

    loadEntries();

    drawChart();

}

function getEntryDate(entry) {

    if (entry.date) {

        return entry.date;

    }

    if (entry.timestamp) {

        const date = new Date(entry.timestamp);

        if (!isNaN(date.getTime())) {

            return getDateKey(date);

        }

    }

    return "";

}

function formatTimestamp(timestamp) {

    const date = new Date(timestamp);

    if (isNaN(date.getTime())) {

        return timestamp || "";

    }

    return date.toLocaleString("ja-JP");

}

function deleteEntry(index) {

    const entries = getEntries();

    if (index < 0 || index >= entries.length) {

        return;

    }

    if (!confirm("この記録を削除しますか？")) {

        return;

    }

    entries.splice(index, 1);

    localStorage.setItem(

        "journalEntries",

        JSON.stringify(entries)

    );

    loadEntries();

    drawChart();

}

function loadEntries() {

    entriesContainer.innerHTML = "";

    const entries = getEntries();

    const targetDate = getDateKey(currentDate);

    const filtered = entries

        .map((entry, index) => ({ ...entry, originalIndex: index }))

        .filter(entry => getEntryDate(entry) === targetDate)

        .sort((a, b) => {

            return new Date(b.timestamp) - new Date(a.timestamp);

        });

    if (filtered.length === 0) {

        entriesContainer.innerHTML =

            '<p class="empty-message">この日の記録はありません。</p>';

        return;

    }

    filtered.forEach(entry => {

        const div = document.createElement("div");

        div.className = "entry";

        const time = document.createElement("strong");

        time.textContent = formatTimestamp(entry.timestamp);

        const mood = document.createElement("div");

        mood.textContent = "気分: " + entry.mood;

        const text = document.createElement("div");

        text.textContent = entry.text || "";

        const button = document.createElement("button");

        button.className = "delete-button";

        button.type = "button";

        button.textContent = "削除";

        button.addEventListener("click", function() {

            deleteEntry(entry.originalIndex);

        });

        div.appendChild(time);

        div.appendChild(document.createElement("br"));

        div.appendChild(mood);

        div.appendChild(text);

        div.appendChild(button);

        entriesContainer.appendChild(div);

    });

}

function drawChart() {

    const entries = getEntries();

    const endDate = new Date(currentDate);

    endDate.setHours(0, 0, 0, 0);

    const startDate = new Date(endDate);

    startDate.setDate(startDate.getDate() - 29);

    const labels = [];

    const moods = [];

    for (let i = 0; i < 30; i++) {

        const date = new Date(startDate);

        date.setDate(startDate.getDate() + i);

        const dateKey = getDateKey(date);

        labels.push(

            date.toLocaleDateString("ja-JP", {

                month: "numeric",

                day: "numeric"

            })

        );

        const dailyMoods = entries

            .filter(entry => getEntryDate(entry) === dateKey)

            .map(entry => Number(entry.mood))

            .filter(mood => Number.isFinite(mood));

        if (dailyMoods.length === 0) {

            moods.push(null);

        } else {

            const sum = dailyMoods.reduce((a, b) => a + b, 0);

            moods.push(sum / dailyMoods.length);

        }

    }

    const movingAverage = moods.map((_, index) => {

        const start = Math.max(0, index - 6);

        const subset = moods

            .slice(start, index + 1)

            .filter(value => value !== null);

        if (subset.length === 0) {

            return null;

        }

        const sum = subset.reduce((a, b) => a + b, 0);

        return sum / subset.length;

    });

    const ctx = document.getElementById("moodChart").getContext("2d");

    if (chartInstance) {

        chartInstance.destroy();

    }

    chartInstance = new Chart(ctx, {

        type: "line",

        data: {

            labels: labels,

            datasets: [

                {

                    label: "1日平均",

                    data: moods,

                    borderWidth: 2,

                    tension: 0.2,

                    spanGaps: false

                },

                {

                    label: "7日移動平均",

                    data: movingAverage,

                    borderWidth: 2,

                    tension: 0.2,

                    spanGaps: false

                }

            ]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            scales: {

                y: {

                    min: 1,

                    max: 7,

                    ticks: {

                        stepSize: 1

                    }

                }

            }

        }

    });

}

document.getElementById("saveButton").addEventListener(

    "click",

    saveEntry

);

document.getElementById("prevDateButton").addEventListener(

    "click",

    function() {

        changeDate(-1);

    }

);

document.getElementById("nextDateButton").addEventListener(

    "click",

    function() {

        changeDate(1);

    }

);

document.querySelectorAll('input[name="mood"]').forEach(radio => {

    radio.addEventListener("change", function() {

        moodValue.textContent = this.value;

    });

});

updateDateLabel();

loadEntries();

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register("sw.js")

        .catch(error => console.error("Service Worker error:", error));

}

</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

drawChart();

</script>

</body>

</html>
